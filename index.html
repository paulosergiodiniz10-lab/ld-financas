<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LD Finanças</title>
    
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <style>
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; line-height: 1; }
      
      /* Bloqueia a seleção de texto para dificultar a cópia */
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      input, textarea, select {
        -webkit-user-select: auto;
        -moz-user-select: auto;
        -ms-user-select: auto;
        user-select: auto;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Ativar o PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>

    <!-- SCRIPT DE BLINDAGEM ANTI-INSPEÇÃO -->
    <script>
      // Desativa o botão direito do mouse
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Desativa os atalhos de teclado comuns de desenvolvedores
      document.onkeydown = function(e) {
        // F12
        if(e.keyCode == 123) { return false; }
        // Ctrl+Shift+I (Windows/Linux) ou Cmd+Option+I (Mac)
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
        if(e.metaKey && e.altKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
        // Ctrl+Shift+C (Inspecionar Elemento)
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
        if(e.metaKey && e.altKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
        // Ctrl+Shift+J (Console)
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
        if(e.metaKey && e.altKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
        // Ctrl+U (Ver Código Fonte)
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
        if(e.metaKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
      }
    </script>
  </body>
</html>
